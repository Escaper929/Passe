name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 校验并构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码检查
        run: npm run lint

      - name: 单元测试
        run: npm run test

      # 视觉回归失败时，把实际渲染图与差异报告带出来 ——
      # 否则日志里只剩"某条探针第几个点偏了多少"，没法一眼看出画面变成了什么样
      - name: 上传视觉回归诊断产物
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diagnostics
          path: src/test/visual/__out__/
          if-no-files-found: ignore
          retention-days: 14

      - name: 格式检查
        run: npm run format:check

      - name: 构建
        run: npm run build

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
